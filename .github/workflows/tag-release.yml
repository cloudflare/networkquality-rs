name: tag release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  tag:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          head_ref="${{ github.event.pull_request.head.ref }}"
          if [ "release/v${version}" != "${head_ref}" ]; then
            echo "::error::Cargo.toml says ${version} but PR branch is ${head_ref}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          set -euo pipefail
          tag="v${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "${tag}"
          git push origin "${tag}"

      - name: Sync the bump back to develop
        continue-on-error: true # no-op when develop already matches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --base develop --head main \
            --title "chore: sync v${{ steps.ver.outputs.version }} to develop" \
            --body "Brings the released version bump back into develop."

  release:
    needs: tag
    uses: ./.github/workflows/release.yml
    with:
      tag: v${{ needs.tag.outputs.version }}
    permissions:
      contents: write
