[package]
name = "cf-mach"
version = "0.2.2"
edition = "2024"
authors = [
    "Fisher Darling <fisher@cloudflare.com>",
    "Lina Baquero <lina@cloudflare.com>",
    "Cloudflare",
]
description = "Network quality measurement CLI for latency, throughput, packet loss, and responsiveness"
repository = "https://github.com/cloudflare/networkquality-rs"
license = "BSD-3-Clause"
readme = "README.md"
keywords = ["network-quality", "latency", "speedtest", "responsiveness", "packet-loss"]
categories = ["command-line-utilities", "network-programming"]
publish = ["crates-io"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]
default-run = "mach"

[[bin]]
name = "mach"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:clap-verbosity-flag", "dep:tracing-subscriber"]

[dependencies]
anyhow = { version = "1.0", features = ["backtrace"] }
boring = "5.0"
bytes = "1.6.0"
clap = { version = "4.3", optional = true, features = ["derive"] }
clap-verbosity-flag = { version = "2.1", optional = true }
http = "1.0"
http-body-util = "0.1.2"
humansize = "2.1.3"
hyper = { version = "1.0", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
pin-project-lite = "0.2"
rand = "0.8"
rustls = { version = "0.23.10", default-features = false, features = ["std", "ring"] }
rustls-native-certs = "0.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "time", "net", "test-util", "macros"] }
tokio-boring = "5.0"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "fmt"] }
url = { version = "2.4", features = ["serde"] }
webrtc = "0.12.0"

[profile.release]
debug = 1

